#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "bindgen-future-payload-woe-test"
version = "0.1.0"
authors = ["itowlson <ivan.towlson@fermyon.com>"]
description = ""

[[trigger.http]]
route = "/..."
component = "bindgen-future-payload-woe-test"

[component.bindgen-future-payload-woe-test]
source = "target/wasm32-wasip2/release/bindgen_future_payload_woe_test.wasm"
allowed_outbound_hosts = []
[component.bindgen-future-payload-woe-test.build]
command = "cargo build --target wasm32-wasip2 --release"
watch = ["src/**/*.rs", "Cargo.toml"]
